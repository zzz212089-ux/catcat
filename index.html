<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>catcat跑跳碰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .retro-font {
            font-family: 'Press Start 2P', 'Noto Sans TC', monospace;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .btn-game {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #374151;
        }
        .btn-game:active, .btn-game.active-press {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #374151;
        }
    </style>
</head>
<body class="bg-amber-50/70 text-stone-800 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 transition-colors duration-500">

    <!-- 頂部狀態與標題 -->
    <div class="w-full max-w-3xl mb-3 flex flex-col sm:flex-row items-start sm:items-end justify-between gap-2 px-1">
        <div>
            <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-md bg-stone-200 text-xs font-bold tracking-wider uppercase mb-1 text-stone-600">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                ERR_CAT_NOT_FOUND
            </div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight flex items-center gap-2 text-stone-900">
                <span>🐈‍⬛</span> catcat跑跳碰
            </h1>
        </div>
        <div class="flex items-center gap-3 self-end sm:self-auto">
            <button id="soundToggle" class="px-3 py-1.5 rounded-lg bg-stone-200 hover:bg-stone-300 text-stone-800 text-xs font-bold flex items-center gap-1.5 transition">
                <span id="soundIcon">🔊</span> <span id="soundText">音效開啟</span>
            </button>
        </div>
    </div>

    <!-- 遊戲畫布容器 -->
    <div class="relative w-full max-w-4xl bg-[#fffdf7] rounded-2xl border-4 border-stone-800 shadow-xl overflow-hidden py-4 sm:py-6">
        <!-- 頂部計分板 -->
        <div class="absolute top-6 right-6 z-10 flex items-center gap-4 retro-font text-xs sm:text-sm tracking-wider text-stone-500 pointer-events-none">
            <div>HI <span id="hiScoreEl">00000</span></div>
            <div class="text-stone-900 font-bold"><span id="scoreEl">00000</span></div>
        </div>

        <!-- 小魚乾計數 -->
        <div class="absolute top-6 left-6 z-10 flex items-center gap-1.5 retro-font text-xs sm:text-sm text-amber-600 pointer-events-none">
            <span>🐟</span> <span id="fishCountEl">0</span>
        </div>

        <!-- 主畫布 -->
        <canvas id="gameCanvas" class="w-full h-[260px] sm:h-[330px] block cursor-pointer my-2"></canvas>

        <!-- 開始與遊戲結束覆蓋介面 -->
        <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-white/80 backdrop-blur-[2px] transition-opacity duration-200">
            <div id="overlayIcon" class="text-5xl mb-2 animate-bounce">🐈‍⬛</div>
            <h2 id="overlayTitle" class="text-xl sm:text-2xl font-black mb-5 text-stone-900">準備好開跑了嗎？</h2>

            <!-- 排行榜輸入介面 -->
            <div id="nameInputContainer" class="hidden flex flex-col items-center mb-4">
                <p class="text-xs sm:text-sm font-bold text-stone-700 mb-2">輸入 3 位數英文名字登上排行榜：</p>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="initial1" maxlength="1" class="w-12 h-14 text-center text-2xl font-bold uppercase border-2 border-stone-800 rounded-lg bg-white focus:outline-none focus:border-amber-500 shadow-sm" value="C">
                    <input type="text" id="initial2" maxlength="1" class="w-12 h-14 text-center text-2xl font-bold uppercase border-2 border-stone-800 rounded-lg bg-white focus:outline-none focus:border-amber-500 shadow-sm" value="A">
                    <input type="text" id="initial3" maxlength="1" class="w-12 h-14 text-center text-2xl font-bold uppercase border-2 border-stone-800 rounded-lg bg-white focus:outline-none focus:border-amber-500 shadow-sm" value="T">
                </div>
                <button id="saveScoreBtn" class="px-5 py-2 bg-stone-800 hover:bg-stone-700 text-white font-bold rounded-xl text-xs sm:text-sm tracking-wider uppercase transition shadow-md">
                    儲存成績
                </button>
            </div>

            <!-- 排行榜展示 -->
            <div id="leaderboardBox" class="w-80 sm:w-96 bg-stone-100 rounded-2xl p-4 mb-5 border-2 border-stone-300 shadow-md">
                <div class="text-xs sm:text-sm font-black text-stone-700 mb-2.5 flex justify-between border-b-2 border-stone-200 pb-1.5">
                    <span>🏆 英雄排行榜 (Top 5)</span>
                    <span>名字 / 得分</span>
                </div>
                <div id="leaderboardList" class="space-y-2 text-xs sm:text-sm text-stone-600 font-mono">
                    <!-- 動態填充 -->
                </div>
            </div>

            <button id="startBtn" class="btn-game px-6 py-2.5 bg-amber-400 hover:bg-amber-300 text-stone-950 font-black rounded-xl border-2 border-stone-900 text-sm sm:text-base flex items-center gap-2">
                <span>▶</span> <span id="startBtnText">開始奔跑 (空白鍵 / 點擊)</span>
            </button>
        </div>
    </div>

    <!-- 虛擬控制按鈕 -->
    <div class="w-full max-w-4xl mt-4 grid grid-cols-2 gap-3 sm:gap-4">
        <button id="jumpBtn" class="btn-game py-4 bg-stone-800 hover:bg-stone-700 text-white font-bold rounded-2xl border-2 border-stone-950 flex flex-col items-center justify-center gap-1 active:bg-stone-900">
            <span class="text-lg sm:text-xl">⬆️ 跳躍 (Jump)</span>
            <span class="text-[11px] text-stone-400 font-normal">空白鍵 / ↑ / W / 點擊畫面</span>
        </button>
        <button id="duckBtn" class="btn-game py-4 bg-amber-500 hover:bg-amber-400 text-stone-950 font-bold rounded-2xl border-2 border-stone-900 flex flex-col items-center justify-center gap-1 active:bg-amber-600">
            <span class="text-lg sm:text-xl">⬇️ 壓低貼地 (Crouch)</span>
            <span class="text-[11px] text-stone-800 font-normal">按住 ↓ / S (空中可快速下墜)</span>
        </button>
    </div>

    <!-- 底部簡易圖鑑提示 -->
    <div class="w-full max-w-4xl mt-4 px-4 py-2.5 rounded-xl bg-stone-200/80 text-xs text-stone-700 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-3 flex-wrap">
            <span class="font-bold text-stone-900">障礙物：</span>
            <span>🥒 驚嚇小黃瓜</span>
            <span>📦 誘惑宅配紙箱</span>
            <span>🗑️ 街角垃圾桶</span>
            <span>🦅 烏鴉 (高空/低空)</span>
        </div>
        <div class="font-bold text-amber-600">
            🐟 黃金小魚乾 +50 分
        </div>
    </div>

    <script>
        window.onload = function () {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const scoreEl = document.getElementById('scoreEl');
            const hiScoreEl = document.getElementById('hiScoreEl');
            const fishCountEl = document.getElementById('fishCountEl');
            const overlay = document.getElementById('overlay');
            const overlayIcon = document.getElementById('overlayIcon');
            const overlayTitle = document.getElementById('overlayTitle');
            const overlaySub = document.getElementById('overlaySub');
            const startBtn = document.getElementById('startBtn');
            const startBtnText = document.getElementById('startBtnText');
            const jumpBtn = document.getElementById('jumpBtn');
            const duckBtn = document.getElementById('duckBtn');
            const soundToggle = document.getElementById('soundToggle');
            const soundIcon = document.getElementById('soundIcon');
            const soundText = document.getElementById('soundText');

            const nameInputContainer = document.getElementById('nameInputContainer');
            const initial1 = document.getElementById('initial1');
            const initial2 = document.getElementById('initial2');
            const initial3 = document.getElementById('initial3');
            const saveScoreBtn = document.getElementById('saveScoreBtn');
            const leaderboardList = document.getElementById('leaderboardList');

            // 音效合成器 (Web Audio API)
            let soundEnabled = true;
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playSound(type) {
                if (!soundEnabled) return;
                initAudio();
                if (!audioCtx) return;

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.exponentialRampToValueAtTime(620, now + 0.11);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.11);
                    osc.start(now);
                    osc.stop(now + 0.11);
                } else if (type === 'fish') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.setValueAtTime(880, now + 0.06); // A5
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (type === 'milestone') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(190, now);
                    osc.frequency.linearRampToValueAtTime(65, now + 0.25);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            }

            soundToggle.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
                soundText.textContent = soundEnabled ? '音效開啟' : '音效靜音';
            });

            // 畫布尺寸設定
            const GAME_WIDTH = 920;
            const GAME_HEIGHT = 310;
            const GROUND_Y = 258;

            function resizeCanvas() {
                canvas.width = GAME_WIDTH;
                canvas.height = GAME_HEIGHT;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 遊戲狀態變數
            let gameState = 'IDLE'; // IDLE, PLAYING, GAMEOVER
            let score = 0;
            let hiScore = 0;
            let fishCount = 0;
            let gameSpeed = 6.5;
            let frameCount = 0;
            let timeCycle = 'day'; // 'day', 'sunset', 'night'
            let lastMilestone = 0;

            // 排行榜資料管理
            let leaderboard = [];

            try {
                const savedLB = localStorage.getItem('black_cat_404_leaderboard');
                if (savedLB) {
                    leaderboard = JSON.parse(savedLB);
                }
            } catch (e) {}

            function updateLeaderboardUI() {
                leaderboardList.innerHTML = '';
                leaderboard.sort((a, b) => b.score - a.score);
                const top5 = leaderboard.slice(0, 5);

                if (top5.length === 0) {
                    leaderboardList.innerHTML = '<div class="text-center text-stone-400 py-3 text-xs sm:text-sm">尚無記錄，快來挑戰！</div>';
                    hiScoreEl.textContent = '00000';
                    return;
                }

                top5.forEach((item, idx) => {
                    const row = document.createElement('div');
                    row.className = 'flex justify-between items-center py-1 px-2 rounded-lg hover:bg-stone-200/80 transition-colors';
                    let medal = `#${idx + 1}`;
                    if (idx === 0) medal = '🥇';
                    else if (idx === 1) medal = '🥈';
                    else if (idx === 2) medal = '🥉';

                    row.innerHTML = `
                        <span class="font-bold text-stone-800 text-xs sm:text-sm flex items-center gap-1.5">
                            <span class="inline-block w-6 text-center">${medal}</span> 
                            <span class="tracking-widest font-mono text-stone-900 font-black">${item.name}</span>
                        </span>
                        <span class="font-black text-amber-600 text-sm sm:text-base">${String(item.score).padStart(5, '0')}</span>
                    `;
                    leaderboardList.appendChild(row);
                });

                if (top5.length > 0) {
                    hiScore = top5[0].score;
                    hiScoreEl.textContent = String(hiScore).padStart(5, '0');
                }
            }
            updateLeaderboardUI();

            // 限制輸入框只能是英文字母
            [initial1, initial2, initial3].forEach((input, index, arr) => {
                input.addEventListener('input', (e) => {
                    let val = e.target.value.replace(/[^a-zA-Z]/g, '').toUpperCase();
                    e.target.value = val;
                    if (val && index < arr.length - 1) {
                        arr[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        arr[index - 1].focus();
                    }
                });
            });

            saveScoreBtn.addEventListener('click', () => {
                const n1 = initial1.value.trim() || 'C';
                const n2 = initial2.value.trim() || 'A';
                const n3 = initial3.value.trim() || 'T';
                const playerName = (n1 + n2 + n3).toUpperCase();
                const finalScore = Math.floor(score);

                leaderboard.push({ name: playerName, score: finalScore });
                leaderboard.sort((a, b) => b.score - a.score);
                leaderboard = leaderboard.slice(0, 5);

                try {
                    localStorage.setItem('black_cat_404_leaderboard', JSON.stringify(leaderboard));
                } catch (e) {}

                updateLeaderboardUI();
                nameInputContainer.classList.add('hidden');
                if (overlaySub) {
                    overlaySub.innerHTML = `<span class="text-green-600 font-bold">成績已成功登錄！</span> ｜ 得分：<strong class="text-amber-500">${finalScore}</strong>`;
                }
                startBtnText.textContent = '再跑一次 (空白鍵 / 點擊)';
            });

            // 黑貓主角物件
            const cat = {
                x: 68,
                y: GROUND_Y,
                vy: 0,
                gravity: 0.72,
                jumpPower: -13.6,
                standW: 44,
                standH: 40,
                duckW: 56,
                duckH: 24,
                isJumping: false,
                isDucking: false,
                isDead: false,
                animTimer: 0,
                legFrame: 0,

                get currentW() {
                    return this.isDucking && !this.isJumping ? this.duckW : this.standW;
                },
                get currentH() {
                    return this.isDucking && !this.isJumping ? this.duckH : this.standH;
                },
                get topY() {
                    return this.y - this.currentH;
                },

                jump() {
                    if (!this.isJumping && !this.isDead) {
                        this.vy = this.jumpPower;
                        this.isJumping = true;
                        playSound('jump');
                        for (let i = 0; i < 6; i++) {
                            particles.push({
                                x: this.x + 15,
                                y: GROUND_Y,
                                vx: -Math.random() * 3 - 1,
                                vy: -Math.random() * 2,
                                size: Math.random() * 4 + 2,
                                alpha: 0.8,
                                color: timeCycle === 'night' ? '#57534e' : '#a8a29e'
                            });
                        }
                    }
                },

                duck(state) {
                    this.isDucking = state;
                    if (this.isJumping && state && this.vy < 6) {
                        this.vy += 3.2;
                    }
                },

                update() {
                    if (this.isJumping) {
                        this.vy += this.isDucking ? this.gravity * 1.9 : this.gravity;
                        this.y += this.vy;
                        if (this.y >= GROUND_Y) {
                            this.y = GROUND_Y;
                            this.vy = 0;
                            this.isJumping = false;
                        }
                    }

                    this.animTimer++;
                    if (this.animTimer % 6 === 0) {
                        this.legFrame = (this.legFrame + 1) % 2;
                    }
                },

                draw(ctx) {
                    ctx.save();
                    const baseX = this.x;
                    const baseY = this.topY;
                    const catFill = '#18181b';

                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = 0;

                    if (this.isDucking && !this.isJumping) {
                        const tailWave = Math.sin(frameCount * 0.25) * 4;
                        ctx.beginPath();
                        ctx.moveTo(baseX + 4, baseY + 12);
                        ctx.quadraticCurveTo(baseX - 14, baseY + 6 + tailWave, baseX - 20, baseY + 12 + tailWave);
                        ctx.lineWidth = 5;
                        ctx.strokeStyle = catFill;
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        ctx.fillStyle = catFill;
                        ctx.fillRect(baseX, baseY + 6, 42, 14);
                        ctx.fillRect(baseX + 36, baseY + 2, 18, 15);

                        ctx.beginPath();
                        ctx.moveTo(baseX + 36, baseY + 4);
                        ctx.lineTo(baseX + 29, baseY - 1);
                        ctx.lineTo(baseX + 42, baseY + 2);
                        ctx.fill();

                        ctx.fillStyle = '#facc15';
                        ctx.fillRect(baseX + 47, baseY + 7, 5, 3);

                        ctx.fillStyle = catFill;
                        if (this.legFrame === 0) {
                            ctx.fillRect(baseX + 6, baseY + 20, 6, 4);
                            ctx.fillRect(baseX + 32, baseY + 20, 6, 4);
                        } else {
                            ctx.fillRect(baseX + 14, baseY + 20, 6, 4);
                            ctx.fillRect(baseX + 24, baseY + 20, 6, 4);
                        }
                    } else {
                        const tailSwing = Math.sin(frameCount * 0.2) * 5;
                        ctx.beginPath();
                        ctx.moveTo(baseX + 6, baseY + 20);
                        ctx.quadraticCurveTo(baseX - 10, baseY + 10, baseX - 6 + tailSwing, baseY - 2);
                        ctx.lineWidth = 5;
                        ctx.strokeStyle = catFill;
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        ctx.fillStyle = catFill;
                        ctx.fillRect(baseX + 4, baseY + 14, 28, 18);
                        ctx.fillRect(baseX + 24, baseY + 2, 18, 16);

                        ctx.beginPath();
                        ctx.moveTo(baseX + 25, baseY + 3);
                        ctx.lineTo(baseX + 28, baseY - 6);
                        ctx.lineTo(baseX + 33, baseY + 3);
                        ctx.fill();

                        ctx.beginPath();
                        ctx.moveTo(baseX + 33, baseY + 3);
                        ctx.lineTo(baseX + 38, baseY - 6);
                        ctx.lineTo(baseX + 42, baseY + 3);
                        ctx.fill();

                        ctx.fillStyle = '#f43f5e';
                        ctx.beginPath();
                        ctx.moveTo(baseX + 27, baseY + 2);
                        ctx.lineTo(baseX + 28.5, baseY - 3);
                        ctx.lineTo(baseX + 31, baseY + 2);
                        ctx.fill();

                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(baseX + 24, baseY + 17, 15, 3);
                        ctx.fillStyle = '#fbbf24';
                        ctx.fillRect(baseX + 36, baseY + 18, 4, 4);

                        if (this.isDead) {
                            ctx.strokeStyle = '#facc15';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.moveTo(baseX + 33, baseY + 6);
                            ctx.lineTo(baseX + 39, baseY + 12);
                            ctx.moveTo(baseX + 39, baseY + 6);
                            ctx.lineTo(baseX + 33, baseY + 12);
                            ctx.stroke();
                        } else {
                            ctx.fillStyle = '#facc15';
                            ctx.fillRect(baseX + 34, baseY + 7, 5, 5);
                            ctx.fillStyle = '#000000';
                            ctx.fillRect(baseX + 37, baseY + 8, 2, 3);
                        }

                        ctx.strokeStyle = '#78716c';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(baseX + 41, baseY + 13);
                        ctx.lineTo(baseX + 46, baseY + 12);
                        ctx.moveTo(baseX + 41, baseY + 15);
                        ctx.lineTo(baseX + 46, baseY + 16);
                        ctx.stroke();

                        ctx.fillStyle = catFill;
                        if (this.isJumping) {
                            ctx.fillRect(baseX + 2, baseY + 30, 6, 8);
                            ctx.fillRect(baseX + 28, baseY + 30, 6, 8);
                        } else if (this.legFrame === 0) {
                            ctx.fillRect(baseX + 6, baseY + 32, 5, 8);
                            ctx.fillRect(baseX + 25, baseY + 32, 5, 8);
                            ctx.fillRect(baseX + 14, baseY + 30, 5, 5);
                        } else {
                            ctx.fillRect(baseX + 11, baseY + 32, 5, 8);
                            ctx.fillRect(baseX + 20, baseY + 32, 5, 8);
                            ctx.fillRect(baseX + 27, baseY + 30, 5, 5);
                        }
                    }
                    ctx.restore();
                }
            };

            let clouds = [];
            let stars = [];
            let groundDots = [];
            let obstacles = [];
            let fishes = [];
            let particles = [];
            let floatingTexts = [];
            let spawnTimer = 0;

            function initEnvironment() {
                clouds = [];
                for (let i = 0; i < 4; i++) {
                    clouds.push({
                        x: Math.random() * GAME_WIDTH,
                        y: 35 + Math.random() * 80,
                        w: 46 + Math.random() * 25,
                        speed: 0.6 + Math.random() * 0.5
                    });
                }
                stars = [];
                for (let i = 0; i < 25; i++) {
                    stars.push({
                        x: Math.random() * GAME_WIDTH,
                        y: 20 + Math.random() * 130,
                        size: Math.random() > 0.5 ? 2 : 3,
                        blinkOffset: Math.random() * 100
                    });
                }
                groundDots = [];
                for (let i = 0; i < 35; i++) {
                    groundDots.push({
                        x: Math.random() * GAME_WIDTH,
                        y: GROUND_Y + 6 + Math.random() * 18,
                        w: 2 + Math.random() * 6
                    });
                }
            }
            initEnvironment();

            function spawnObstacle() {
                const rand = Math.random();
                let obs = {
                    x: GAME_WIDTH + 30,
                    passed: false
                };

                if (score > 220 && rand < 0.28) {
                    const heights = [GROUND_Y - 52, GROUND_Y - 24];
                    const chosenY = heights[Math.floor(Math.random() * heights.length)];
                    obs.type = 'CROW';
                    obs.y = chosenY;
                    obs.w = 40;
                    obs.h = 24;
                } else if (rand < 0.55) {
                    const isDouble = score > 150 && Math.random() < 0.45;
                    obs.type = 'CUCUMBER';
                    obs.w = isDouble ? 34 : 18;
                    obs.h = isDouble ? 42 : 38;
                    obs.y = GROUND_Y - obs.h;
                    obs.isDouble = isDouble;
                } else if (rand < 0.8) {
                    obs.type = 'CARDBOARD_BOX';
                    obs.w = 40;
                    obs.h = 36;
                    obs.y = GROUND_Y - obs.h;
                } else {
                    obs.type = 'TRASH';
                    obs.w = 32;
                    obs.h = 48;
                    obs.y = GROUND_Y - obs.h;
                }

                obstacles.push(obs);

                if (Math.random() < 0.38) {
                    fishes.push({
                        x: GAME_WIDTH + 180 + Math.random() * 80,
                        y: GROUND_Y - (Math.random() > 0.45 ? 78 : 26),
                        w: 24,
                        h: 14,
                        collected: false,
                        floatOffset: Math.random() * Math.PI * 2
                    });
                }
            }

            function drawObstacle(ctx, obs) {
                ctx.save();
                if (obs.type === 'CUCUMBER') {
                    const drawSingleCucumber = (cx, cy, cw, ch) => {
                        ctx.fillStyle = '#16a34a';
                        ctx.strokeStyle = '#14532d';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.roundRect(cx, cy, cw, ch, 8);
                        ctx.fill();
                        ctx.stroke();

                        ctx.fillStyle = '#bbf7d0';
                        ctx.fillRect(cx + 4, cy + 8, 2, 2);
                        ctx.fillRect(cx + cw - 6, cy + 16, 2, 2);
                        ctx.fillRect(cx + 5, cy + 26, 2, 2);
                    };
                    if (obs.isDouble) {
                        drawSingleCucumber(obs.x, obs.y + 4, 15, obs.h - 4);
                        drawSingleCucumber(obs.x + 18, obs.y, 16, obs.h);
                    } else {
                        drawSingleCucumber(obs.x, obs.y, obs.w, obs.h);
                    }
                } else if (obs.type === 'CARDBOARD_BOX') {
                    const bx = obs.x;
                    const by = obs.y + 6;
                    const bw = obs.w;
                    const bh = obs.h - 6;
                    const topDepth = 7;

                    ctx.strokeStyle = '#78350f';
                    ctx.lineWidth = 1.6;
                    ctx.lineJoin = 'round';

                    ctx.fillStyle = '#e6b88a';
                    ctx.beginPath();
                    ctx.moveTo(bx, by);
                    ctx.lineTo(bx + 8, by - topDepth);
                    ctx.lineTo(bx + bw, by - topDepth);
                    ctx.lineTo(bx + bw - 8, by);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#d99b66';
                    ctx.fillRect(bx, by, bw - 8, bh);
                    ctx.strokeRect(bx, by, bw - 8, bh);

                    ctx.fillStyle = '#b87d4b';
                    ctx.beginPath();
                    ctx.moveTo(bx + bw - 8, by);
                    ctx.lineTo(bx + bw, by - topDepth);
                    ctx.lineTo(bx + bw, by + bh - topDepth);
                    ctx.lineTo(bx + bw - 8, by + bh);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#fef3c7';
                    ctx.strokeStyle = '#92400e';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(bx + 13, by);
                    ctx.lineTo(bx + 21, by - topDepth);
                    ctx.lineTo(bx + 27, by - topDepth);
                    ctx.lineTo(bx + 19, by);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillRect(bx + 13, by, 6, 9);
                    ctx.strokeRect(bx + 13, by, 6, 9);

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(bx + 4, by + 13, 14, 11);
                    ctx.fillStyle = '#1c1917';
                    ctx.fillRect(bx + 6, by + 15, 10, 2);
                    ctx.fillRect(bx + 6, by + 19, 7, 2);

                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(bx + 22, by + 16, 6, 7);
                } else if (obs.type === 'TRASH') {
                    ctx.fillStyle = '#94a3b8';
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 1.5;
                    ctx.fillRect(obs.x + 2, obs.y + 8, obs.w - 4, obs.h - 8);
                    ctx.strokeRect(obs.x + 2, obs.y + 8, obs.w - 4, obs.h - 8);

                    ctx.fillStyle = '#cbd5e1';
                    ctx.fillRect(obs.x - 1, obs.y + 3, obs.w + 2, 5);
                    ctx.strokeRect(obs.x - 1, obs.y + 3, obs.w + 2, 5);
                    ctx.fillRect(obs.x + 10, obs.y, obs.w - 20, 3);

                    ctx.fillStyle = '#475569';
                    ctx.fillRect(obs.x + 7, obs.y + 13, 3, obs.h - 18);
                    ctx.fillRect(obs.x + 15, obs.y + 13, 3, obs.h - 18);
                    ctx.fillRect(obs.x + 23, obs.y + 13, 3, obs.h - 18);
                } else if (obs.type === 'CROW') {
                    const wingUp = Math.floor(frameCount / 7) % 2 === 0;

                    ctx.fillStyle = '#18181b';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 30, obs.y + 9);
                    ctx.lineTo(obs.x + 41, obs.y + 5);
                    ctx.lineTo(obs.x + 39, obs.y + 12);
                    ctx.lineTo(obs.x + 42, obs.y + 17);
                    ctx.lineTo(obs.x + 30, obs.y + 16);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#09090b';
                    ctx.beginPath();
                    ctx.roundRect(obs.x + 9, obs.y + 7, 24, 11, 5);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(obs.x + 9, obs.y + 10, 6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 4, obs.y + 7);
                    ctx.lineTo(obs.x - 5, obs.y + 11);
                    ctx.lineTo(obs.x + 4, obs.y + 13);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(obs.x + 7, obs.y + 9, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(obs.x + 6, obs.y + 8.5, 1.5, 1.5);

                    ctx.fillStyle = '#18181b';
                    ctx.strokeStyle = '#3f3f46';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    if (wingUp) {
                        ctx.moveTo(obs.x + 13, obs.y + 9);
                        ctx.lineTo(obs.x + 21, obs.y - 7);
                        ctx.lineTo(obs.x + 31, obs.y + 9);
                    } else {
                        ctx.moveTo(obs.x + 13, obs.y + 14);
                        ctx.lineTo(obs.x + 21, obs.y + 27);
                        ctx.lineTo(obs.x + 31, obs.y + 14);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.restore();
            }

            function drawFish(ctx, f) {
                if (f.collected) return;
                ctx.save();
                const fy = f.y + Math.sin(frameCount * 0.1 + f.floatOffset) * 3;
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.ellipse(f.x + 10, fy + 7, 9, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(f.x + 18, fy + 7);
                ctx.lineTo(f.x + 24, fy + 2);
                ctx.lineTo(f.x + 24, fy + 12);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(f.x + 4, fy + 5, 2, 2);
                ctx.restore();
            }

            function checkCollision(rect1, rect2) {
                const padX = 6;
                const padY = 5;
                return (
                    rect1.x + padX < rect2.x + rect2.w &&
                    rect1.x + rect1.w - padX > rect2.x &&
                    rect1.y + padY < rect2.y + rect2.h &&
                    rect1.y + rect1.h - padY > rect2.y
                );
            }

            function resetGame() {
                score = 0;
                fishCount = 0;
                gameSpeed = 6.5;
                frameCount = 0;
                lastMilestone = 0;

                cat.y = GROUND_Y;
                cat.vy = 0;
                cat.isJumping = false;
                cat.isDucking = false;
                cat.isDead = false;

                obstacles = [];
                fishes = [];
                particles = [];
                floatingTexts = [];
                spawnTimer = 50;

                scoreEl.textContent = '00000';
                fishCountEl.textContent = '0';
                overlay.classList.add('opacity-0', 'pointer-events-none');
                gameState = 'PLAYING';
            }

            function triggerGameOver() {
                gameState = 'GAMEOVER';
                cat.isDead = true;
                playSound('hit');

                const finalScore = Math.floor(score);
                if (overlayIcon) overlayIcon.textContent = '😿';
                if (overlayTitle) overlayTitle.textContent = 'GAME OVER 撞到啦！';
                if (overlaySub) {
                    overlaySub.innerHTML = `本次得分：<strong class="text-amber-500">${finalScore}</strong> ｜ 收集小魚乾：<strong class="text-amber-500">${fishCount} 隻</strong>`;
                }

                const lowestScore = leaderboard.length < 5 ? 0 : leaderboard[leaderboard.length - 1].score;
                if (finalScore > 0 && (leaderboard.length < 5 || finalScore > lowestScore)) {
                    nameInputContainer.classList.remove('hidden');
                    startBtnText.textContent = '直接略過重開 (空白鍵 / 點擊)';
                    initial1.focus();
                } else {
                    nameInputContainer.classList.add('hidden');
                    startBtnText.textContent = '再跑一次 (空白鍵 / 點擊)';
                }

                updateLeaderboardUI();
                overlay.classList.remove('opacity-0', 'pointer-events-none');
            }

            function updateGame() {
                if (gameState !== 'PLAYING') return;

                frameCount++;
                score += gameSpeed * 0.025;
                const currentIntScore = Math.floor(score);
                scoreEl.textContent = String(currentIntScore).padStart(5, '0');

                if (gameSpeed < 14.5) {
                    gameSpeed += 0.0012;
                }

                if (currentIntScore > 0 && currentIntScore % 100 === 0 && currentIntScore !== lastMilestone) {
                    lastMilestone = currentIntScore;
                    playSound('milestone');
                }

                const cyclePhase = Math.floor(currentIntScore / 600) % 3;
                if (cyclePhase === 0) timeCycle = 'day';
                else if (cyclePhase === 1) timeCycle = 'sunset';
                else timeCycle = 'night';

                cat.update();

                clouds.forEach(c => {
                    c.x -= c.speed;
                    if (c.x + c.w < 0) {
                        c.x = GAME_WIDTH + 20;
                        c.y = 30 + Math.random() * 80;
                    }
                });

                groundDots.forEach(d => {
                    d.x -= gameSpeed;
                    if (d.x + d.w < 0) {
                        d.x = GAME_WIDTH + Math.random() * 30;
                        d.y = GROUND_Y + 6 + Math.random() * 18;
                    }
                });

                spawnTimer--;
                if (spawnTimer <= 0) {
                    spawnObstacle();
                    const minGap = Math.max(42, Math.floor(88 - gameSpeed * 3));
                    spawnTimer = minGap + Math.floor(Math.random() * 45);
                }

                const catBox = {
                    x: cat.x,
                    y: cat.topY,
                    w: cat.currentW,
                    h: cat.currentH
                };

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.x -= obs.type === 'CROW' ? gameSpeed * 1.12 : gameSpeed;

                    if (checkCollision(catBox, obs)) {
                        triggerGameOver();
                        return;
                    }

                    if (obs.x + obs.w < -20) {
                        obstacles.splice(i, 1);
                    }
                }

                for (let i = fishes.length - 1; i >= 0; i--) {
                    const f = fishes[i];
                    f.x -= gameSpeed;

                    if (!f.collected && checkCollision(catBox, f)) {
                        f.collected = true;
                        fishCount++;
                        score += 50;
                        fishCountEl.textContent = String(fishCount);
                        playSound('fish');
                        floatingTexts.push({
                            x: f.x,
                            y: f.y,
                            text: '+50 🐟',
                            alpha: 1
                        });
                    }

                    if (f.x + f.w < -20 || f.collected) {
                        fishes.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.04;
                    if (p.alpha <= 0) particles.splice(i, 1);
                }

                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    const ft = floatingTexts[i];
                    ft.y -= 1.2;
                    ft.alpha -= 0.03;
                    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
                }
            }

            function drawScene() {
                let bgColor = '#fffdf7';
                let groundColor = '#f5f5f4';
                let cloudColor = '#e7e5e4';

                if (timeCycle === 'sunset') {
                    bgColor = '#fffbeb';
                    groundColor = '#fef3c7';
                    cloudColor = '#fed7aa';
                } else if (timeCycle === 'night') {
                    bgColor = '#1e1b4b';
                    groundColor = '#312e81';
                    cloudColor = '#4338ca';
                }

                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                if (timeCycle === 'day') {
                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.arc(680, 52, 18, 0, Math.PI * 2);
                    ctx.fill();
                } else if (timeCycle === 'sunset') {
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.arc(680, 55, 24, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(251, 191, 36, 0.35)';
                    ctx.beginPath();
                    ctx.arc(680, 55, 36, 0, Math.PI * 2);
                    ctx.fill();
                } else if (timeCycle === 'night') {
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath();
                    ctx.arc(680, 52, 16, 0, Math.PI * 2);
                    ctx.fill();

                    stars.forEach(s => {
                        const alpha = 0.4 + Math.abs(Math.sin((frameCount + s.blinkOffset) * 0.04)) * 0.6;
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.fillRect(s.x, s.y, s.size, s.size);
                    });
                }

                ctx.fillStyle = cloudColor;
                clouds.forEach(c => {
                    ctx.beginPath();
                    ctx.roundRect(c.x, c.y, c.w, 14, 7);
                    ctx.roundRect(c.x + 10, c.y - 8, c.w * 0.6, 12, 6);
                    ctx.fill();
                });

                ctx.fillStyle = groundColor;
                ctx.fillRect(0, GROUND_Y, GAME_WIDTH, GAME_HEIGHT - GROUND_Y);

                ctx.strokeStyle = timeCycle === 'night' ? '#6366f1' : '#78716c';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, GROUND_Y);
                ctx.lineTo(GAME_WIDTH, GROUND_Y);
                ctx.stroke();

                ctx.fillStyle = timeCycle === 'night' ? '#4f46e5' : '#a8a29e';
                groundDots.forEach(d => {
                    ctx.fillRect(d.x, d.y, d.w, 2);
                });

                fishes.forEach(f => drawFish(ctx, f));
                obstacles.forEach(obs => drawObstacle(ctx, obs));

                cat.draw(ctx);

                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1;

                floatingTexts.forEach(ft => {
                    ctx.save();
                    ctx.font = 'bold 14px "Press Start 2P", monospace';
                    ctx.fillStyle = `rgba(245, 158, 11, ${Math.max(0, ft.alpha)})`;
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.restore();
                });
            }

            function gameLoop() {
                updateGame();
                drawScene();
                requestAnimationFrame(gameLoop);
            }

            function handleJumpAction(e) {
                if (e && e.cancelable) e.preventDefault();
                if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                    return;
                }
                if (gameState !== 'PLAYING') {
                    resetGame();
                } else {
                    cat.jump();
                }
            }

            window.addEventListener('keydown', (e) => {
                if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                    return;
                }
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                    e.preventDefault();
                    jumpBtn.classList.add('active-press');
                    handleJumpAction();
                } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                    e.preventDefault();
                    duckBtn.classList.add('active-press');
                    if (gameState === 'PLAYING') cat.duck(true);
                }
            });

            window.addEventListener('keyup', (e) => {
                if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                    return;
                }
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                    jumpBtn.classList.remove('active-press');
                } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
                    duckBtn.classList.remove('active-press');
                    cat.duck(false);
                }
            });

            startBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                resetGame();
            });

            canvas.addEventListener('pointerdown', (e) => {
                handleJumpAction(e);
            });

            jumpBtn.addEventListener('pointerdown', (e) => {
                handleJumpAction(e);
            });

            duckBtn.addEventListener('pointerdown', (e) => {
                if (e.cancelable) e.preventDefault();
                if (gameState === 'PLAYING') cat.duck(true);
            });
            duckBtn.addEventListener('pointerup', () => cat.duck(false));
            duckBtn.addEventListener('pointerleave', () => cat.duck(false));
            duckBtn.addEventListener('pointercancel', () => cat.duck(false));

            gameLoop();
        };
    </script>
</body>
</html>
